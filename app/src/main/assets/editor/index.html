<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeForge Studio Editor</title>
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <div id="editor-container">
        <div id="editor-area">
            <div id="gutter"></div>
            <div id="code-wrapper">
                <pre id="highlight-layer" aria-hidden="true"></pre>
                <textarea id="code-editor" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
                <div id="autocomplete-box"></div>
            </div>
        </div>
    </div>
    <script src="editor.js"></script>
</body>
</html>
