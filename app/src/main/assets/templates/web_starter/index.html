<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge Web Starter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>CodeForge Studio</h1>

    </div>
    <script src="app.js"></script>
</body>
</html>
